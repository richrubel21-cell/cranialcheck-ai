<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#1E88E5"/>
<title>CranialCheck AI — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1E88E5;--blue2:#1565C0;--blueL:rgba(30,136,229,.08);
  --green:#16a34a;--amber:#d97706;--orange:#e65100;--red:#b71c1c;--bad:#dc2626;
  --tx:#0A1E38;--tx2:#4A5B73;--tx3:#94a3b8;--border:#E2E8F0;
  --f:'Outfit',sans-serif;--m:'IBM Plex Mono',monospace;--p:'Playfair Display',serif;
}
body{font-family:var(--f);color:var(--tx);background:#F2F5F9;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── ACCESS GATE ── */
.gate{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:linear-gradient(160deg,#F2F5F9,#E8EDF4);transition:opacity .5s}
.gate.hide{opacity:0;pointer-events:none}
.gate-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gate-mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#0A1E38,#143656);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(10,30,56,.3)}
.gate-word{font-family:var(--p);font-size:26px;font-weight:700;color:#0A1E38}
.gate-word span{color:var(--blue)}
.gate-sub{font-size:14px;color:var(--tx2);line-height:1.6;max-width:320px}
.gate-input{width:100%;max-width:300px;font-family:var(--m);letter-spacing:3px;font-size:15px;text-align:center;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);background:#fff;color:#0A1E38;outline:none;transition:border-color .2s}
.gate-input:focus{border-color:var(--blue)}
.gate-input.shake{animation:shake .4s}
.gate-btn{width:100%;max-width:300px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#1E88E5,#1565C0);color:#fff;font-weight:800;font-size:14px;letter-spacing:1px;border:none;cursor:pointer;font-family:var(--f);box-shadow:0 6px 20px rgba(30,136,229,.4)}
.gate-err{font-size:12px;color:var(--bad);font-weight:700;min-height:16px}

/* ── DASHBOARD ── */
.dash{display:none;min-height:100vh;flex-direction:column}
.dash.show{display:flex;animation:fadeIn .5s}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px;width:100%}

.hdr{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(10,30,56,.04)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0A1E38,#143656);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-title{font-family:var(--p);font-size:19px;font-weight:700;color:#0A1E38}
.hdr-title span{color:var(--blue)}
.hdr-sub{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-link{font-size:13px;font-weight:600;color:var(--tx2);padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:#fff;cursor:pointer}
.hdr-link:hover{border-color:var(--blue);color:var(--blue)}
.btn-blue{padding:9px 18px;border-radius:9px;background:linear-gradient(135deg,#1E88E5,#1565C0);color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer;font-family:var(--f);box-shadow:0 4px 14px rgba(30,136,229,.3)}
.btn-blue:hover{transform:translateY(-1px)}

.body{padding:26px 0 40px;flex:1}
.section-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx2);margin:0 0 14px}

/* summary cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(10,30,56,.05);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--blue)}
.stat.s-green::before{background:var(--green)}.stat.s-red::before{background:var(--bad)}
.stat-lbl{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-family:var(--p);font-size:34px;font-weight:900;color:#0A1E38;margin-top:6px;line-height:1}
.stat-val.green{color:var(--green)}.stat-val.red{color:var(--bad)}.stat-val.blue{color:var(--blue)}
.stat-pct{font-size:12px;color:var(--tx2);font-family:var(--m);margin-top:4px}

/* breakdown bars */
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(10,30,56,.05);margin-bottom:28px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-name{width:90px;font-size:13px;font-weight:700;flex-shrink:0}
.bar-track{flex:1;height:22px;background:#F2F5F9;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.22,1,.36,1);min-width:2px}
.bar-count{width:54px;text-align:right;font-family:var(--m);font-size:13px;font-weight:600;color:var(--tx2);flex-shrink:0}

/* table */
.table-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 18px rgba(10,30,56,.05);overflow:hidden;margin-bottom:22px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1020px}
th{text-align:left;padding:13px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);background:#F8FAFC;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);color:var(--tx);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--m)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.5px}
.dom-good{color:var(--green);font-weight:600}
.dom-warn{color:var(--amber);font-weight:600}
.dom-bad{color:var(--bad);font-weight:600}
.raw{display:block;color:var(--tx3);font-family:var(--m);font-size:10.5px;font-weight:400;margin-top:2px}
.detail-row td{font-family:var(--m);font-size:11px;color:var(--tx2);padding:7px 12px;border-bottom:2px solid var(--border)}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 22px}
.pager-info{font-size:13px;color:var(--tx2);font-family:var(--m)}
.pg-btn{padding:8px 16px;border-radius:9px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:13px;color:var(--tx2);cursor:pointer}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-btn:not(:disabled):hover{border-color:var(--blue);color:var(--blue)}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.btn-out{padding:11px 20px;border-radius:10px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--f)}
.btn-out:hover{background:var(--blueL)}
.btn-danger{padding:11px 20px;border-radius:10px;border:1.5px solid var(--bad);background:#fff;color:var(--bad);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--f)}
.btn-danger:hover{background:rgba(220,38,38,.06)}

.state{text-align:center;padding:60px 20px;color:var(--tx2)}
.state-big{font-size:17px;font-weight:700;color:#0A1E38;margin-bottom:8px}
.state.err .state-big{color:var(--bad)}
.state a{color:var(--blue);font-weight:700}

footer{border-top:1px solid var(--border);background:#fff;padding:22px 0;margin-top:auto}
.foot-1{font-family:var(--p);font-size:15px;font-weight:700;color:#0A1E38}
.foot-2{font-size:12px;color:var(--tx2);margin-top:4px;font-family:var(--m)}

@media(max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .stats{grid-template-columns:1fr}
  .hdr-sub{display:none}
}
</style>
</head>
<body>

<!-- ACCESS GATE -->
<div class="gate" id="gate">
  <div class="gate-logo">
    <div class="gate-mark">
      <svg viewBox="0 0 28 28" width="30" height="30" fill="none">
        <circle cx="14" cy="14" r="10" stroke="#90CAF9" stroke-width="1.5" opacity=".6"/>
        <circle cx="14" cy="14" r="5" stroke="#90CAF9" stroke-width="1.5"/>
        <circle cx="14" cy="14" r="2" fill="#1E88E5"/>
        <line x1="14" y1="4" x2="14" y2="9" stroke="#90CAF9" stroke-width="1" opacity=".5"/>
        <line x1="14" y1="19" x2="14" y2="24" stroke="#90CAF9" stroke-width="1" opacity=".5"/>
        <line x1="4" y1="14" x2="9" y2="14" stroke="#90CAF9" stroke-width="1" opacity=".5"/>
        <line x1="19" y1="14" x2="24" y2="14" stroke="#90CAF9" stroke-width="1" opacity=".5"/>

  <div class="hdr">

          <svg viewBox="0 0 28 28" width="24" height="24" fill="none">

</div>

<script>
const SUPABASE_URL = 'https://rtklrkslujbbprkpyghc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0a2xya3NsdWpiYnBya3B5Z2hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDUzMjYsImV4cCI6MjA5NzYyMTMyNn0.IK8uZKlnThrLnMH_obh_XCI8hF_wcKkRNxmUtKJE0tI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── ACCESS GATE ──
function checkGate(){
  var input=document.getElementById('gateInput');
  var err=document.getElementById('gateErr');
  var val=(input.value||'').trim();
  if(val==='predictwell2026'){
    try{sessionStorage.setItem('cc_admin_access','1');}catch(e){}
    err.textContent='';
    enterDashboard();
  }else{
    err.textContent='Incorrect password';
    input.value='';
    input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
  }
}
function enterDashboard(){
  var g=document.getElementById('gate');
  g.classList.add('hide');
  setTimeout(function(){g.style.display='none';},500);
  document.getElementById('dash').classList.add('show');
  loadData();
}

// ── STATUS META ──
var STATUS={
  NORMAL:{color:'var(--green)',hex:'#16a34a',tint:'rgba(22,163,74,.06)',badge:'rgba(22,163,74,.12)'},
  WATCH :{color:'var(--amber)',hex:'#d97706',tint:'rgba(217,119,6,.06)',badge:'rgba(217,119,6,.12)'},
  FLAG  :{color:'var(--orange)',hex:'#e65100',tint:'rgba(230,81,0,.06)',badge:'rgba(230,81,0,.12)'},
  URGENT:{color:'var(--red)',hex:'#b71c1c',tint:'rgba(183,28,28,.06)',badge:'rgba(183,28,28,.12)'}
};
function smeta(s){return STATUS[s]||{color:'var(--tx2)',hex:'#94a3b8',tint:'transparent',badge:'#eef2f7'};}
function flagClass(f){return f==='good'?'dom-good':f==='warn'?'dom-warn':f==='bad'?'dom-bad':'';}
function browserName(ua){
  ua=ua||'';
  if(/edg/i.test(ua))return 'Edge';
  if(/firefox|fxios/i.test(ua))return 'Firefox';
  if(/chrome|crios|crmo/i.test(ua))return 'Chrome';
  if(/safari/i.test(ua))return 'Safari';
  return 'Other';
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(s){
  if(!s)return '—';
  var d=new Date(s);
  if(isNaN(d.getTime()))return esc(s);
  return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

// ── DATA ──
var ROWS=[];
var page=0;
var PAGE_SIZE=20;

async function loadData(){
  var c=document.getElementById('dashContent');
  c.innerHTML='<div class="state"><div class="state-big">Loading…</div><div>Fetching exam records from Supabase.</div></div>';
  try{
    var res=await sb.from('exams').select('*').order('created_at',{ascending:false});
    if(res.error){throw new Error(res.error.message);}
    ROWS=res.data||[];
    page=0;
    if(ROWS.length===0){renderEmpty();return;}
    renderDashboard();
  }catch(e){
    c.innerHTML='<div class="state err"><div class="state-big">Could not load data. Check connection.</div><div class="mono">'+esc(e.message||'')+'</div></div>';
  }
}

function renderEmpty(){
  document.getElementById('dashContent').innerHTML=
    '<div class="state"><div class="state-big">No exams recorded yet.</div>'
    +'<div>Run the demo to see data here. <a href="cranialcheck-demo.html">Open the demo →</a></div></div>';
}

function renderDashboard(){
  var total=ROWS.length;
  var counts={NORMAL:0,WATCH:0,FLAG:0,URGENT:0};
  var confSum=0,confN=0;
  ROWS.forEach(function(r){
    var s=r.overall_result;
    if(counts[s]!==undefined)counts[s]++;
    if(typeof r.confidence==='number'){confSum+=r.confidence;confN++;}
  });
  var normalPct=total?Math.round(counts.NORMAL/total*100):0;
  var flagUrgent=counts.FLAG+counts.URGENT;
  var flagPct=total?Math.round(flagUrgent/total*100):0;
  var avgConf=confN?Math.round(confSum/confN):0;

  var h='';

  // SUMMARY
  h+='<div class="stats">'
    +'<div class="stat"><div class="stat-lbl">Total Exams</div><div class="stat-val">'+total+'</div></div>'
    +'<div class="stat s-green"><div class="stat-lbl">Normal</div><div class="stat-val green">'+counts.NORMAL+'</div><div class="stat-pct">'+normalPct+'% of total</div></div>'
    +'<div class="stat s-red"><div class="stat-lbl">Flag / Urgent</div><div class="stat-val red">'+flagUrgent+'</div><div class="stat-pct">'+flagPct+'% of total</div></div>'
    +'<div class="stat"><div class="stat-lbl">Avg Confidence</div><div class="stat-val blue">'+avgConf+'%</div></div>'
    +'</div>';

  // BREAKDOWN
  h+='<div class="panel"><div class="section-t">Results Breakdown</div><div class="bars">';
  ['NORMAL','WATCH','FLAG','URGENT'].forEach(function(s){
    var n=counts[s], pct=total?(n/total*100):0;
    h+='<div class="bar-row"><div class="bar-name" style="color:'+smeta(s).hex+'">'+s+'</div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+smeta(s).hex+'"></div></div>'
      +'<div class="bar-count">'+n+'</div></div>';
  });
  h+='</div></div>';

  // TABLE
  var pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(page>=pages)page=pages-1;
  var start=page*PAGE_SIZE;
  var slice=ROWS.slice(start,start+PAGE_SIZE);

  h+='<div class="section-t">Exam Records</div>';
  h+='<div class="table-card"><div class="table-scroll"><table><thead><tr>'
    +'<th>#</th><th>Date &amp; Time</th><th>Mode</th><th>Result</th><th>Confidence</th>'
    +'<th>Alertness</th><th>Facial Motor</th><th>GCS</th><th>Tongue</th><th>Head</th><th>Device</th>'
    +'</tr></thead><tbody>';
  var rv=function(v,dec){return (v==null||isNaN(v))?'—':Number(v).toFixed(dec);};
  var ri=function(v){return (v==null||isNaN(v))?'—':Math.round(v);};
  var raw=function(s){return '<span class="raw">'+s+'</span>';};
  slice.forEach(function(r,i){
    var m=smeta(r.overall_result);
    var headRaw='yaw σ '+rv(r.head_yaw_sd,1)+'° · pitch σ '+rv(r.head_pitch_sd,1)+'° · roll σ '+rv(r.head_roll_sd,1)+'°';
    h+='<tr style="background:'+m.tint+'">'
      +'<td class="mono">'+(start+i+1)+'</td>'
      +'<td>'+fmtDate(r.created_at)+'</td>'
      +'<td>'+esc(r.exam_mode||'—')+'</td>'
      +'<td><span class="badge" style="background:'+m.badge+';color:'+m.hex+'">'+esc(r.overall_result||'—')+'</span></td>'
      +'<td class="mono">'+(r.confidence!=null?r.confidence+'%':'—')+'</td>'
      +'<td class="'+flagClass(r.perclos_flag)+'">'+esc(r.perclos_label||'—')+raw('(PERCLOS: '+ri(r.perclos_value)+'%)')+'</td>'
      +'<td class="'+flagClass(r.cn7_flag)+'">'+esc(r.cn7_label||'—')+raw('(asym: '+rv(r.cn7_value,3)+')')+'</td>'
      +'<td class="'+flagClass(r.gcs_flag)+'">'+esc(r.gcs_label||'—')+raw('(E: '+ri(r.gcs_e)+')')+'</td>'
      +'<td class="'+flagClass(r.tongue_flag)+'">'+esc(r.tongue_label||'—')+raw('(aperture: '+rv(r.tongue_value,2)+')')+'</td>'
      +'<td class="'+flagClass(r.head_flag)+'">'+esc(r.head_label||'—')+raw('('+headRaw+')')+'</td>'
      +'<td>'+esc(browserName(r.device_info))+'</td>'
      +'</tr>';
    h+='<tr class="detail-row" style="background:'+m.tint+'"><td colspan="11">'
      +'Valid frames: '+ri(r.valid_frame_pct)+'% &nbsp;|&nbsp; Lighting: '+ri(r.lighting_score)+'% &nbsp;|&nbsp; '
      +'Calibration: '+ri(r.calibration_stability)+'% &nbsp;|&nbsp; Completion: '+ri(r.completion_rate)+'% &nbsp;|&nbsp; '
      +'Duration: '+rv(r.exam_duration_sec,1)+'s &nbsp;|&nbsp; FPS: '+ri(r.avg_fps)
      +'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  // PAGER
  h+='<div class="pager">'
    +'<button class="pg-btn" '+(page<=0?'disabled':'')+' onclick="gotoPage('+(page-1)+')">‹ Prev</button>'
    +'<span class="pager-info">Page '+(page+1)+' of '+pages+' · '+total+' records</span>'
    +'<button class="pg-btn" '+(page>=pages-1?'disabled':'')+' onclick="gotoPage('+(page+1)+')">Next ›</button>'
    +'</div>';

  // ACTIONS
  h+='<div class="actions">'
    +'<button class="btn-out" onclick="exportCSV()">⬇ Export CSV</button>'
    +'<button class="btn-danger" onclick="clearAll()">🗑 Clear All Data</button>'
    +'</div>';

  document.getElementById('dashContent').innerHTML=h;
}

function gotoPage(p){page=p;renderDashboard();window.scrollTo({top:0,behavior:'smooth'});}

// ── EXPORT CSV ──
function exportCSV(){
  if(!ROWS.length)return;
  // Full dump: every column present on any record, in a stable preferred order,
  // with any unexpected columns appended so nothing is ever omitted.
  var preferred=['id','created_at','exam_mode','overall_result','confidence',
    'perclos_label','perclos_metric','perclos_flag','perclos_value',
    'cn7_label','cn7_metric','cn7_flag','cn7_value',
    'gcs_label','gcs_metric','gcs_flag','gcs_e',
    'tongue_label','tongue_metric','tongue_flag','tongue_value',
    'head_label','head_metric','head_flag','head_yaw_sd','head_pitch_sd','head_roll_sd',
    'valid_frame_pct','lighting_score','calibration_stability','completion_rate',
    'exam_duration_sec','avg_fps','subject_age','subject_sex','subject_id',
    'device_info','session_id'];
  var seen={}, cols=[];
  preferred.forEach(function(c){ if(!seen[c] && ROWS.some(function(r){return c in r;})){seen[c]=1;cols.push(c);} });
  ROWS.forEach(function(r){ Object.keys(r).forEach(function(k){ if(!seen[k]){seen[k]=1;cols.push(k);} }); });
  function cell(v){
    var s=String(v==null?'':v);
    if(/[",\n]/.test(s))s='"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  var lines=[cols.join(',')];
  ROWS.forEach(function(r){
    lines.push(cols.map(function(c){return cell(r[c]);}).join(','));
  });
  var blob=new Blob([lines.join('\n')],{type:'text/csv'});
  var ts=new Date().toISOString().replace(/[:.]/g,'-').replace('T','_').slice(0,19);
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cranialcheck-admin-'+ts+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

// ── CLEAR ALL ──
async function clearAll(){
  var typed=window.prompt('This permanently deletes ALL exam records.\nType DELETE to confirm:');
  if(typed!=='DELETE'){return;}
  try{
    var res=await sb.from('exams').delete().neq('id','00000000-0000-0000-0000-000000000000');
    if(res.error){throw new Error(res.error.message);}
    alert('All exam data cleared.');
    loadData();
  }catch(e){
    alert('Delete failed: '+(e.message||'unknown error'));
  }
}
